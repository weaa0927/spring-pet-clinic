apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic
  namespace: was
spec:
  replicas: 3
  selector:
    matchLabels:
      app: petclinic
  template:
    metadata:
      labels:
        app: petclinic
    spec:
      containers:
      - name: petclinic
        image: weaa0927/petclinic:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: SERVER_SERVLET_CONTEXT_PATH
          value: /clinic
        - name: JAVA_TOOL_OPTIONS
          value: "-Xmx300m"
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
