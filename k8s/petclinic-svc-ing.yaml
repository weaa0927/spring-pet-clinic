apiVersion: v1
kind: Service
metadata:
  name: petclinic
  namespace: was
spec:
  type: ClusterIP
  selector:
    app: petclinic
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: petclinic-ingress
  namespace: was
spec:
  ingressClassName: nginx
  rules:
  - host: www.ljw.com
    http:
      paths:
      - path: /clinic
        pathType: Prefix
        backend:
          service:
            name: petclinic
            port:
              number: 8080
